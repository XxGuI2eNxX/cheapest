<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheapest · ราคาต่อกิโล</title>
<meta name="description" content="คำนวณราคาต่อกิโลจากน้ำหนักและราคา เทียบได้ 3 รายการ">
<link rel="icon" type="image/png" href="icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="Cheapest">
<style>
  :root { --bg:#fafafa; --ink:#657b83; --faint:#cfd8dc; --line:#cfd8dc; --focus:#ffc107;
          --blue:#0095ff; --good:#12a150; --box:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --ink:#9fb3bd; --faint:#3a454d; --line:#3a454d; --box:#1d232a; --good:#3ddc84; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; padding:20px 20px 40px; }
  h1 { margin:8px 0 0; text-align:center; font-size:1.3rem; }
  .grid { display:grid; grid-template-columns:32px 1fr 1fr 96px; gap:12px 8px; align-items:center; margin-top:40px; }
  .col { text-align:center; color:var(--faint); font-weight:600; font-size:1.2rem; }
  .row { font-size:2rem; font-weight:700; text-align:center; }
  input { width:100%; height:48px; font:inherit; font-size:1.2rem; text-align:center; color:var(--ink);
          background:var(--box); border:4px solid var(--line); border-radius:4px; padding:0 4px; }
  input:focus { outline:none; border-color:var(--focus); }
  .res { text-align:center; font-weight:700; font-size:1.05rem; line-height:1.2; min-height:48px; display:flex; flex-direction:column; justify-content:center; }
  .res.best { color:var(--good); }
  .res small { font-weight:400; font-size:.75rem; color:var(--ink); }
  .nav { display:flex; margin-top:36px; }
  #clear { flex:1; height:56px; border:0; border-radius:14px; font:inherit; font-size:1.4rem; cursor:pointer;
           background:var(--blue); color:#fff; font-weight:600; }
  #out { margin-top:28px; text-align:center; min-height:70px; }
  .win { font-size:1.5rem; font-weight:700; color:var(--good); }
  .sub { margin-top:6px; }
  .units { margin-top:14px; display:flex; justify-content:center; gap:22px; font-size:1.05rem; flex-wrap:wrap; }
  .units b { display:block; font-size:1.3rem; }
  .units .best b { color:var(--good); }
  .units small { display:block; font-size:.8rem; }
  .swap { display:block; margin-top:28px; text-align:center; color:var(--ink); font-size:1.15rem; text-decoration:none;
          border:2px solid var(--line); border-radius:14px; padding:14px; }
</style>
</head>
<body>
<div class="app">
  <h1>⚖ ราคาต่อกิโล</h1>

  <div class="grid">
    <div></div><div class="col">g</div><div class="col">cost</div><div class="col">/kg</div>
    <div class="row">A</div>
    <input id="a1" inputmode="decimal" autocomplete="off" aria-label="A น้ำหนัก กรัม">
    <input id="a2" inputmode="decimal" autocomplete="off" aria-label="A ราคา">
    <div class="res" id="r_a"></div>
    <div class="row">B</div>
    <input id="b1" inputmode="decimal" autocomplete="off" aria-label="B น้ำหนัก กรัม">
    <input id="b2" inputmode="decimal" autocomplete="off" aria-label="B ราคา">
    <div class="res" id="r_b"></div>
    <div class="row">C</div>
    <input id="c1" inputmode="decimal" autocomplete="off" aria-label="C น้ำหนัก กรัม">
    <input id="c2" inputmode="decimal" autocomplete="off" aria-label="C ราคา">
    <div class="res" id="r_c"></div>
  </div>

  <div class="nav"><button id="clear">Clear</button></div>
  <div id="out"></div>

  <a class="swap" href="index.html">‹ เปรียบเทียบราคาต่อหน่วย</a>
</div>

<script>
const $ = id => document.getElementById(id);
const ids = ['a1','a2','b1','b2','c1','c2'];
const rows = ['a','b','c'];
const n = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; };
const f = (x, d = 2) => x.toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });

function update() {
  const out = $('out');
  rows.forEach(r => { $('r_' + r).textContent = ''; $('r_' + r).className = 'res'; });
  const list = rows.map(r => {
    const g = n($(r + '1').value), c = n($(r + '2').value);
    return { r, L: r.toUpperCase(), kg: g > 0 && c > 0 ? c / g * 1000 : null };
  }).filter(x => x.kg != null);
  if (!list.length) { out.innerHTML = ''; return; }
  const lo = Math.min(...list.map(x => x.kg)), hi = Math.max(...list.map(x => x.kg));
  list.forEach(x => {
    const el = $('r_' + x.r), best = list.length > 1 && x.kg - lo < 1e-9;
    el.className = 'res' + (best ? ' best' : '');
    el.innerHTML = f(x.kg) + (list.length > 1 && !best ? `<small>+${f((x.kg / lo - 1) * 100, 1)}%</small>` : '');
  });
  if (list.length < 2) { out.innerHTML = ''; return; }
  out.innerHTML = hi - lo < 1e-9 ? '<div class="win">ราคาเท่ากัน</div>'
    : `<div class="win">${list.find(x => x.kg === lo).L} ถูกที่สุด</div><div class="sub">ถูกกว่าตัวแพงสุด ${f((1 - lo / hi) * 100, 1)}%</div>`;
}ids.forEach(id => {
  $(id).addEventListener('input', update);
  $(id).addEventListener('focus', e => e.target.select());
});
$('clear').onclick = () => { ids.forEach(i => $(i).value = ''); update(); $('a1').focus(); };
window.addEventListener('pageshow', () => { ids.forEach(i => $(i).value = ''); update(); });
update();
</script>
</body>
</html>
