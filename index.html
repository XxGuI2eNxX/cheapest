<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheapest</title>
<meta name="description" content="เปรียบเทียบราคาต่อหน่วย รองรับโปรซื้อ X แถม Y">
<link rel="icon" type="image/png" href="icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="Cheapest">
<meta property="og:type" content="website">
<meta property="og:title" content="Cheapest">
<meta property="og:description" content="เทียบความคุ้มของสินค้า รองรับโปรซื้อ X แถม Y">
<meta property="og:image" content="https://xxgui2enxx.github.io/cheapest/og.png">
<meta property="og:url" content="https://xxgui2enxx.github.io/cheapest/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://xxgui2enxx.github.io/cheapest/og.png">
<style>
  :root { --bg:#fafafa; --ink:#657b83; --faint:#cfd8dc; --line:#cfd8dc; --focus:#ffc107;
          --blue:#0095ff; --good:#12a150; --box:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --ink:#9fb3bd; --faint:#3a454d; --line:#3a454d; --box:#1d232a; --good:#3ddc84; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; padding:20px 20px 40px; }
  .head { display:flex; justify-content:space-between; align-items:center; font-size:1.2rem; }
  .head button { background:none; border:0; color:var(--ink); font:inherit; padding:8px; cursor:pointer; }
  #info { font-family:Georgia,serif; font-style:italic; font-size:1.4rem; }
  .grid { display:grid; grid-template-columns:36px 64px 1fr 1fr; gap:12px 10px; align-items:center; margin-top:48px; }
  .col { text-align:center; color:var(--faint); font-weight:600; font-size:1.2rem; }
  .row { font-size:2rem; font-weight:700; text-align:center; }
  input { width:100%; height:48px; font:inherit; font-size:1.2rem; text-align:center; color:var(--ink);
          background:var(--box); border:4px solid var(--line); border-radius:4px; padding:0 4px; }
  input:focus { outline:none; border-color:var(--focus); }
  .times { color:var(--faint); font-weight:600; }
  .nav { display:flex; gap:14px; margin-top:36px; }
  .nav button { height:56px; border:0; border-radius:14px; font:inherit; font-size:1.4rem; cursor:pointer; }
  #clear { flex:1; background:var(--blue); color:#fff; font-weight:600; }
  #out { margin-top:32px; text-align:center; min-height:130px; }
  .win { font-size:1.5rem; font-weight:700; color:var(--good); }
  .sub { margin-top:6px; }
  .units { margin-top:14px; display:flex; justify-content:center; gap:22px; font-size:1.05rem; flex-wrap:wrap; }
  .units b { display:block; font-size:1.3rem; }
  .units .best b { color:var(--good); }
  .units small { display:block; font-size:.8rem; }
  #help { display:none; margin-top:24px; font-size:.92rem; line-height:1.6; background:var(--box);
          border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  #help.show { display:block; }
</style>
</head>
<body>
<div class="app">
  <div class="head"><button id="info" aria-label="วิธีใช้">i</button></div>

  <div id="help">
    <b>วิธีใช้</b><br>
    <b>ea</b> = จำนวนหน่วยที่ได้ (เว้นว่าง = 1) · <b>size</b> = ขนาดต่อ 1 หน่วย (กรัม/มล./ชิ้น) · <b>cost</b> = ราคารวมที่จ่าย<br>
    ตัวอย่าง ซื้อ 2 แถม 1 ชิ้นละ 40 บาท ขนาด 100 → ea 3, size 100, cost 80<br>
    (จ่าย 2 ชิ้น ได้ 3 ชิ้น) · แถวที่ไม่ใช้เว้นว่างไว้ได้
  </div>

  <div class="grid">
    <div></div><div class="col">ea</div><div class="col">size</div><div class="col">cost</div>
    <div class="row">A</div>
    <input id="a0" inputmode="numeric" autocomplete="off" aria-label="A ea">
    <input id="a1" inputmode="decimal" autocomplete="off" aria-label="A size">
    <input id="a2" inputmode="decimal" autocomplete="off" aria-label="A cost">
    <div class="row">B</div>
    <input id="b0" inputmode="numeric" autocomplete="off" aria-label="B ea">
    <input id="b1" inputmode="decimal" autocomplete="off" aria-label="B size">
    <input id="b2" inputmode="decimal" autocomplete="off" aria-label="B cost">
    <div class="row">C</div>
    <input id="c0" inputmode="numeric" autocomplete="off" aria-label="C ea">
    <input id="c1" inputmode="decimal" autocomplete="off" aria-label="C size">
    <input id="c2" inputmode="decimal" autocomplete="off" aria-label="C cost">
  </div>

  <div class="nav"><button id="clear">Clear</button></div>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const ids = ['a0','a1','a2','b0','b1','b2','c0','c1','c2'];
const rows = ['a','b','c'];
const n = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; };
const f = (x, d = 4) => x.toLocaleString('th-TH', { maximumFractionDigits: d });

function unit(p) {            // ราคาต่อ 1 หน่วย size
  const ea = $(p + '0').value.trim() === '' ? 1 : n($(p + '0').value);
  const size = n($(p + '1').value), cost = n($(p + '2').value);
  return ea > 0 && size > 0 && cost > 0 ? cost / (ea * size) : null;
}
function update() {
  const out = $('out');
  const list = rows.map(r => ({ L: r.toUpperCase(), u: unit(r) })).filter(x => x.u != null);
  if (!list.length) { out.innerHTML = ''; return; }
  const sorted = [...list].sort((x, y) => x.u - y.u), lo = sorted[0].u;
  let head = '';
  if (list.length >= 2) {
    const hi = sorted[sorted.length - 1].u;
    if (hi - lo < 1e-12) head = '<div class="win">ราคาเท่ากัน</div>';
    else head = `<div class="win">${sorted[0].L} ถูกที่สุด</div><div class="sub">ถูกกว่าตัวแพงสุด ${f((1 - lo / hi) * 100, 1)}%</div>`;
  }
  const cells = list.map(x => `<div class="${list.length > 1 && x.u - lo < 1e-12 ? 'best' : ''}">${x.L} ต่อหน่วย<b>${f(x.u)}</b>` +
    (list.length > 1 && x.u - lo >= 1e-12 ? `<small>แพงกว่า +${f((x.u / lo - 1) * 100, 1)}%</small>` : '') + '</div>').join('');
  out.innerHTML = head + `<div class="units">${cells}</div>`;
}
ids.forEach((id, k) => {
  $(id).addEventListener('input', () => {
    const ea = $(id[0] + '0');
    if (id[1] !== '0' && $(id).value.trim() !== '' && ea.value.trim() === '') ea.value = '1';
    update();
  });
  $(id).addEventListener('focus', e => e.target.select());
});
$('clear').onclick = () => { ids.forEach(i => $(i).value = ''); update(); $('a1').focus(); };
$('info').onclick = () => $('help').classList.toggle('show');
window.addEventListener('pageshow', () => { ids.forEach(i => $(i).value = ''); update(); });
update();
</script>
</body>
</html>
