<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เปรียบเทียบราคาต่อหน่วย</title>
<style>
  :root { --bg:#fafafa; --ink:#657b83; --faint:#cfd8dc; --line:#cfd8dc; --focus:#ffc107;
          --blue:#0095ff; --good:#12a150; --box:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --ink:#9fb3bd; --faint:#3a454d; --line:#3a454d; --box:#1d232a; --good:#3ddc84; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; padding:20px 20px 40px; }
  .head { display:flex; justify-content:space-between; align-items:center; font-size:1.2rem; }
  .head button { background:none; border:0; color:var(--ink); font:inherit; padding:8px; cursor:pointer; }
  #info { font-family:Georgia,serif; font-style:italic; font-size:1.4rem; }
  .grid { display:grid; grid-template-columns:36px 1fr 64px 1fr; gap:12px 10px; align-items:center; margin-top:48px; }
  .col { text-align:center; color:var(--faint); font-weight:600; font-size:1.2rem; }
  .row { font-size:2rem; font-weight:700; text-align:center; }
  input { width:100%; height:48px; font:inherit; font-size:1.2rem; text-align:center; color:var(--ink);
          background:var(--box); border:4px solid var(--line); border-radius:4px; padding:0 4px; }
  input:focus { outline:none; border-color:var(--focus); }
  .times { color:var(--faint); font-weight:600; }
  .nav { display:flex; gap:14px; margin-top:36px; }
  .nav button { height:56px; border:0; border-radius:14px; font:inherit; font-size:1.4rem; cursor:pointer; }
  #prev { width:100px; background:var(--line); color:#fff; }
  #next { flex:1; background:var(--blue); color:#fff; font-weight:600; }
  #out { margin-top:32px; text-align:center; min-height:130px; }
  .win { font-size:1.5rem; font-weight:700; color:var(--good); }
  .sub { margin-top:6px; }
  .units { margin-top:14px; display:flex; justify-content:center; gap:28px; font-size:1.05rem; }
  .units b { display:block; font-size:1.3rem; }
  .units .best b { color:var(--good); }
  #help { display:none; margin-top:24px; font-size:.92rem; line-height:1.6; background:var(--box);
          border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  #help.show { display:block; }
</style>
</head>
<body>
<div class="app">
  <div class="head"><button id="info" aria-label="วิธีใช้">i</button><button id="clear">Clear</button></div>

  <div id="help">
    <b>วิธีใช้</b><br>
    <b>size</b> = ขนาดต่อ 1 หน่วย (กรัม/มล./ชิ้น) · <b>×</b> = จำนวนหน่วยที่ได้ · <b>cost</b> = ราคารวมที่จ่าย<br>
    ตัวอย่าง ซื้อ 2 แถม 1 ชิ้นละ 40 บาท ขนาด 100 → size 100, × 3, cost 80<br>
    (จ่าย 2 ชิ้น ได้ 3 ชิ้น) · ไม่มีโปรให้ใส่ × 1
  </div>

  <div class="grid">
    <div></div><div class="col">size</div><div class="col">×</div><div class="col">cost</div>
    <div class="row">A</div>
    <input id="a0" inputmode="decimal" autocomplete="off" aria-label="A size">
    <input id="a1" inputmode="numeric" autocomplete="off" aria-label="A จำนวน" value="1">
    <input id="a2" inputmode="decimal" autocomplete="off" aria-label="A cost">
    <div class="row">B</div>
    <input id="b0" inputmode="decimal" autocomplete="off" aria-label="B size">
    <input id="b1" inputmode="numeric" autocomplete="off" aria-label="B จำนวน" value="1">
    <input id="b2" inputmode="decimal" autocomplete="off" aria-label="B cost">
  </div>

  <div class="nav"><button id="prev">‹</button><button id="next">Next ›</button></div>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const ids = ['a0','a1','a2','b0','b1','b2'];
const KEY = 'compare-price-v2';
const n = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; };
const f = (x, d = 4) => x.toLocaleString('th-TH', { maximumFractionDigits: d });

function unit(p) {            // ราคาต่อ 1 หน่วย size
  const size = n($(p + '0').value), qty = n($(p + '1').value), cost = n($(p + '2').value);
  return size > 0 && qty > 0 && cost > 0 ? cost / (size * qty) : null;
}

function update() {
  try { localStorage.setItem(KEY, JSON.stringify(ids.map(i => $(i).value))); } catch (e) {}
  const a = unit('a'), b = unit('b'), out = $('out');
  if (a == null && b == null) { out.innerHTML = ''; return; }
  const cell = (L, u, best) => `<div class="${best ? 'best' : ''}">${L}<b>${u == null ? '-' : f(u)}</b></div>`;
  let head = '';
  if (a != null && b != null) {
    if (Math.abs(a - b) < 1e-12) head = '<div class="win">ราคาเท่ากัน</div>';
    else {
      const w = a < b ? 'A' : 'B', lo = Math.min(a, b), hi = Math.max(a, b);
      head = `<div class="win">${w} ถูกกว่า</div><div class="sub">ประหยัด ${f((1 - lo / hi) * 100, 1)}% (อีกฝั่งแพงกว่า ${f((hi / lo - 1) * 100, 1)}%)</div>`;
    }
  }
  const bestA = a != null && (b == null || a < b), bestB = b != null && (a == null || b < a);
  out.innerHTML = head + `<div class="units">${cell('A ต่อหน่วย', a, bestA && b != null)}${cell('B ต่อหน่วย', b, bestB && a != null)}</div>`;
}

try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) ids.forEach((i, k) => { if (s[k] != null) $(i).value = s[k]; }); } catch (e) {}
ids.forEach((id, k) => {
  $(id).addEventListener('input', update);
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(1); } });
  $(id).addEventListener('focus', e => e.target.select());
});
const go = d => { const k = Math.max(ids.indexOf(document.activeElement.id), 0); $(ids[(k + d + ids.length) % ids.length]).focus(); };
$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('clear').onclick = () => { ids.forEach(i => $(i).value = i[1] === '1' ? '1' : ''); update(); $('a0').focus(); };
$('info').onclick = () => $('help').classList.toggle('show');
update();
</script>
</body>
</html>
